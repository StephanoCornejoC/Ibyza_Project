# ──────────────────────────────────────────────────────────────────────────────
# Railway deploy config — IBYZA Backend
# ──────────────────────────────────────────────────────────────────────────────
# Build: instala deps + recolecta estaticos.
# Deploy: aplica migraciones + crea tabla cache + crea superuser admin (idempotente)
#         + arranca gunicorn.
#
# NOTA: los seeds (`seed_contenido`, `seed_proyectos`) NO corren en cada deploy.
# Si la DB esta vacia en el primer despliegue, correrlos UNA VEZ desde Railway CLI:
#   railway run python manage.py seed_contenido
#   railway run python manage.py seed_proyectos
# Esto evita sobreescribir datos reales en cada redeploy.
# ──────────────────────────────────────────────────────────────────────────────

[build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements.txt && python manage.py collectstatic --noinput"

[deploy]
startCommand = "python manage.py migrate --noinput && python manage.py createcachetable django_cache_table && python manage.py create_admin && gunicorn ibyza.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --access-logfile - --error-logfile -"
healthcheckPath = "/healthz/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
